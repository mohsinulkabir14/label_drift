languages:
  bengali:
    dual_translation: |
                      Translate this English text to Bengali in TWO ways:
                      1. Literal translation (word-for-word accuracy):
                      "{text}"

                      2. Culturally-adapted translation (as a 50-year-old educated Dhaka male):
                      "{text}"

                      Return ONLY a JSON format like this:
                      {
                          "literal": "[LITERAL_TRANSLATION]",
                          "cultural": "[CULTURAL_TRANSLATION]"
                      }

  greek:
